name: Deploy InspireIT Edu Portal

on:
  push:
    paths:
      - 'smpl-edu/inspireit-edu-portal/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy inspireit-edu-portal
        run: |
          rsync -avz --delete smpl-edu/inspireit-edu-portal/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/inspireit-edu-portal/
